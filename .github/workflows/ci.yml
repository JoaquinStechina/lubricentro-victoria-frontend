name: CI

on:
  # En master no corre por push: ahí lo invoca deploy.yml como paso previo al
  # deploy (workflow_call), así no se duplica el trabajo.
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Misma mayor que la imagen de produccion (node:20-slim en
          # Dockerfile): el build de CI tiene que probar lo mismo que se
          # construye al desplegar.
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # El build es el chequeo que de verdad importa acá: tsc no ve los
      # errores propios de Next (Server/Client Components, rutas, imports que
      # sólo fallan al compilar la app).
      - name: Build
        run: npm run build
